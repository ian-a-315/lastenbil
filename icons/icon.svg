<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41225a"/>
      <stop offset="50%" stop-color="#623776"/>
      <stop offset="100%" stop-color="#8d5aa2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <!-- Subtle road lines -->
  <path d="M68 108 L58 158" stroke="#ffffff" stroke-width="1" opacity="0.07" stroke-linecap="round"/>
  <path d="M68 108 L78 158" stroke="#ffffff" stroke-width="1" opacity="0.07" stroke-linecap="round"/>
  <path d="M132 108 L122 158" stroke="#ffffff" stroke-width="1" opacity="0.07" stroke-linecap="round"/>
  <path d="M132 108 L142 158" stroke="#ffffff" stroke-width="1" opacity="0.07" stroke-linecap="round"/>

  <!-- Ground line -->
  <rect x="50" y="138" width="100" height="3" rx="1.5" fill="#ffffff" opacity="0.1"/>

  <!-- Left headlight glow -->
  <circle cx="68" cy="88" r="28" fill="#0ac7c0" opacity="0.12"/>
  <circle cx="68" cy="88" r="18" fill="#0ac7c0" opacity="0.22"/>
  <circle cx="68" cy="88" r="11" fill="#0ac7c0" opacity="1"/>
  <circle cx="68" cy="88" r="6" fill="#ffffff"/>

  <!-- Right headlight glow -->
  <circle cx="132" cy="88" r="28" fill="#0ac7c0" opacity="0.12"/>
  <circle cx="132" cy="88" r="18" fill="#0ac7c0" opacity="0.22"/>
  <circle cx="132" cy="88" r="11" fill="#0ac7c0" opacity="1"/>
  <circle cx="132" cy="88" r="6" fill="#ffffff"/>
</svg>
